poll_interval_seconds = 300
database_path = "state/state.db"
# Optional headless OAuth credentials for all personal-workspace reads and writes.
# Set both values in the environment. External workspaces keep their API keys.
# Without these credentials, personal operations also use the personal API key.
notification_client_id_env = "LINEAR_NOTIFICATION_CLIENT_ID"
notification_client_secret_env = "LINEAR_NOTIFICATION_CLIENT_SECRET"

[personal]
name = "personal"
# Required for one human-identity read per run, even when using OAuth.
api_key_env = "LINEAR_PERSONAL_API_KEY"
workspace_name = "Personal"
team_name = "Personal"

[external.work]
name = "work"
api_key_env = "LINEAR_WORK_API_KEY"
workspace_name = "Work"
workspace_slug = "work"
team_name = "Work"
routing_label = "sync:work"
# Labels added to the corresponding synced issue or project in the personal workspace.
personal_labels = []
# The routing_label is also recognized on personal projects as a project label.

[external.startup]
name = "startup"
api_key_env = "LINEAR_STARTUP_API_KEY"
workspace_name = "Startup"
workspace_slug = "startup"
team_name = "Startup"
routing_label = "sync:startup"
personal_labels = []

# Add any number of additional [external.<key>] sections with the same fields.

[sync]
conflict_label = "sync:conflict"
broken_label = "sync:broken"
external_unavailable_label = "sync:external-unavailable"

[sync.status_mappings.work]
# personal_status = "external_status"

[sync.status_mappings.startup]
# personal_status = "external_status"
